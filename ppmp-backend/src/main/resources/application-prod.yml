spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:ppmp-db}:${DB_PORT:5432}/${DB_NAME:ppmp}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:ppmp-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    aws:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
  frontend-url: ${FRONTEND_URL:https://ppmp.example.com}
  rate-limit:
    max-requests-per-minute: 100

server:
  port: 8080

logging:
  level:
    root: INFO
    com.ppmp: INFO
